<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }
    .toast-container {
      width: 100%;
      height: 100%;
      background: rgba(20, 16, 32, 0.95);
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(124, 58, 237, 0.3);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(167, 139, 250, 0.2));
      border: 1px solid rgba(167, 139, 250, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.3);
    }
    .content {
      flex: 1;
      min-width: 0;
    }
    .title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 9px;
      text-transform: uppercase;
      font-weight: 800;
      color: #c4b5fd;
      background: rgba(124, 58, 237, 0.3);
      padding: 1px 6px;
      border-radius: 6px;
    }
    .desc {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.35;
    }
    .kbd {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toastCard">
    <div class="icon-box">🫡</div>
    <div class="content">
      <div class="title">
        Crack ItAI   <span class="badge">Stealth Mode</span>
      </div>
      <div class="desc">
        Running in background. Press <span class="kbd">Ctrl + B</span> or click here to restore.
      </div>
    </div>
  </div>
</body>
</html>
